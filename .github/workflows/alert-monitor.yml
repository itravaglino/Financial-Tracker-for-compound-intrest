name: Alert Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger alert check
        run: |
          if [ -n "${{ secrets.FINTRACK_API_URL }}" ] && [ -n "${{ secrets.FINTRACK_API_TOKEN }}" ]; then
            curl -sf -X POST "${{ secrets.FINTRACK_API_URL }}/api/trading/alerts/check" \
              -H "Authorization: Bearer ${{ secrets.FINTRACK_API_TOKEN }}" \
              -H "Content-Type: application/json" || echo "Alert check request failed"
          else
            echo "FINTRACK_API_URL / FINTRACK_API_TOKEN not configured, skipping"
          fi
